name: CI

# Задача из todo.md (этап 0/5): lint + pytest, чтобы зелёный baseline
# (229 passed на 2026-10-13) не деградировал во время разработки.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poem_sim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # ядро требует >= 3.11 (pyproject.toml)

      - name: Install tooling and package
        run: |
          python -m pip install --upgrade pip
          pip install ruff "pytest>=7" tomli
          pip install -e ".[test]"

      - name: Lint (ruff — E4/E7/E9/F/I, конфиг poem_sim/ruff.toml)
        run: ruff check poem tests tools

      - name: Test (pytest — полный прогон)
        run: python -m pytest tests -q

  # Минимальная версия Python, поддерживаемая ядром (guide_server.md §3):
  # проверяем, что код не использует синтаксис/API новых версий.
  min-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poem_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and test on Python 3.11
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=7" tomli
          pip install -e ".[test]"
          python -m pytest tests -q
