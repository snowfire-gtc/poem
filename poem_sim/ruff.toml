# Конфигурация линтера для CI (todo.md: этап 0/5 «CI-конфиг — lint + pytest»).
#
# Философия: CI ловит РЕАЛЬНЫЕ ошибки (битые импорты, мёртвый код,SyntaxError),
# а не косметические предпочтения стиля — иначе наведённый «зелёный» CI был бы
# купирован массовыми правками без ценностной нагрузки для игрока.
# Совместимо с ruff >= 0.4.

target-version = "py311"          # minimum supported Python (guide_server.md §3)

[lint]
select = [
    "E4",    # pycodestyle: line-length imports group (не E501 — переносы)
    "E7",    # pycodestyle: сравнения/присваивания в одну строку
    "E9",    # синтаксические ошибки — блокирующие всегда
    "F",     # pyflakes: неиспользуемые импорты/переменные, undefined names
    "I",     # isort — порядок импортов (автофиксируется `ruff check --fix`)
]
ignore = [
    "E731",  # lambda вместо def — допустимый стиль в движке
    "F841",  # локальная переменная «для читаемости» допустима в тестах/движке
]

[lint.per-file-ignores]
# Тесты намеренно пишут состояние через globals().setdefault(...) — см.
# tests/test_conflict_detection.py (проверка независимости от часа суток).
"tests/*" = ["F821"]
