[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poem-sim"
version = "0.4.0"
description = "Poem: a civ-like game using neural networks — turn simulation core (Design Doc Rev 3: server-side law revisions, no time-of-day effects, Civilization-like dynamic turn intervals)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["poem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
